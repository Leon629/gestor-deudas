<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Deudas</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1976D2; --success: #4CAF50; --danger: #D32F2F; --warning: #FF9800; --info: #00BCD4; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { text-align: center; margin-top: 0; }
        .total { font-size: 1.5em; font-weight: bold; color: var(--danger); text-align: center; margin: 15px 0; }
        input { width: 100%; padding: 10px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        .btn-add { background-color: var(--primary); }
        .btn-export { background-color: var(--success); }
        .btn-toggle { background-color: #607D8B; padding: 8px; font-size: 14px; margin-bottom: 15px;}
        
        /* Botones de tarjetas */
        .btn-edit { background-color: var(--warning); padding: 8px; font-size: 14px; width: 48%; }
        .btn-pagada { background-color: var(--success); padding: 8px; font-size: 14px; width: 48%; float: right; }
        .btn-restore { background-color: var(--info); padding: 8px; font-size: 14px; width: 48%; }
        .btn-delete-hard { background-color: var(--danger); padding: 8px; font-size: 14px; width: 48%; float: right; }
        
        .deuda-item { border-bottom: 1px solid #eee; padding: 15px 0; overflow: hidden; }
        .deuda-item:last-child { border-bottom: none; }
        .deuda-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1em; }
        .deuda-fecha { font-size: 0.8em; color: #777; margin-bottom: 10px; }
        
        /* Estilo para tachar deudas pagadas */
        .tachado { text-decoration: line-through; color: #9E9E9E; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gestor de Deudas Pro</h1>
        <div class="total" id="lblTotal">Cargando datos...</div>
        
        <label>Concepto:</label>
        <input type="text" id="txtConcepto" placeholder="Ej. Préstamo banco">
        
        <label>Monto ($):</label>
        <input type="number" id="txtMonto" placeholder="0.00" step="0.01">
        
        <input type="hidden" id="txtIdEdicion" value="">
        
        <button class="btn-add" id="btnAgregar" onclick="window.guardarDeuda()">➕ Agregar Deuda</button>
        <button class="btn-export" onclick="window.exportarExcel()">📊 Exportar a Excel</button>
    </div>

    <div class="card">
        <h2 id="tituloLista">Mis Deudas Activas</h2>
        <button class="btn-toggle" id="btnToggle" onclick="window.alternarVista()">🗂️ Ver Historial de Pagadas</button>
        <div id="listaDeudas"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBytzDCR9hDJ_7sRp-kRejniLb7eauGw80",
          authDomain: "gestor-de-deudas-app-4ea8d.firebaseapp.com",
          projectId: "gestor-de-deudas-app-4ea8d",
          storageBucket: "gestor-de-deudas-app-4ea8d.firebasestorage.app",
          messagingSenderId: "853056296188",
          appId: "1:853056296188:web:c548776d63a05fba0ff379"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let deudasLocales = [];
        let viendoHistorial = false; // Variable para saber qué pantalla estamos viendo

        // ESCUCHAR DATOS EN TIEMPO REAL
        onSnapshot(collection(db, "deudas"), (snapshot) => {
            deudasLocales = [];
            snapshot.forEach((doc) => {
                deudasLocales.push({ id: doc.id, ...doc.data() });
            });
            actualizarInterfaz();
        });

        window.alternarVista = function() {
            viendoHistorial = !viendoHistorial;
            const btnToggle = document.getElementById('btnToggle');
            const tituloLista = document.getElementById('tituloLista');
            const lblTotal = document.getElementById('lblTotal');
            
            if (viendoHistorial) {
                btnToggle.innerText = "🔙 Volver a Deudas Activas";
                tituloLista.innerText = "Historial (Pagadas)";
                lblTotal.style.color = "#4CAF50"; // Cambiar color a verde
            } else {
                btnToggle.innerText = "🗂️ Ver Historial de Pagadas";
                tituloLista.innerText = "Mis Deudas Activas";
                lblTotal.style.color = "var(--danger)"; // Volver a rojo
            }
            actualizarInterfaz();
        };

        function actualizarInterfaz() {
            const contenedor = document.getElementById('listaDeudas');
            contenedor.innerHTML = '';
            let total = 0;

            // Filtrar la lista dependiendo de lo que el usuario quiera ver
            const deudasFiltradas = deudasLocales.filter(d => {
                // Si la deuda no tiene estado, asumimos que es activa (para compatibilidad con datos viejos)
                const estado = d.estado || 'activa'; 
                if (viendoHistorial) {
                    return estado === 'pagada';
                } else {
                    return estado === 'activa';
                }
            });

            if (deudasFiltradas.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#777;">No hay deudas en esta sección.</p>';
            }

            deudasFiltradas.forEach((deuda) => {
                total += deuda.monto;
                
                // Si estamos en historial, tachamos el texto
                const claseTachado = viendoHistorial ? "tachado" : "";
                
                // Botones dinámicos según la vista
                let botonesHTML = '';
                if (viendoHistorial) {
                    botonesHTML = `
                        <button class="btn-restore" onclick="window.recuperarDeuda('${deuda.id}')">🔄 Recuperar</button>
                        <button class="btn-delete-hard" onclick="window.eliminarDefinitivo('${deuda.id}')">🗑️ Borrar</button>
                    `;
                } else {
                    botonesHTML = `
                        <button class="btn-edit" onclick="window.prepararEdicion('${deuda.id}', '${deuda.concepto}', ${deuda.monto})">✏️ Editar</button>
                        <button class="btn-pagada" onclick="window.marcarPagada('${deuda.id}')">✔️ Pagada</button>
                    `;
                }

                contenedor.innerHTML += `
                    <div class="deuda-item">
                        <div class="deuda-header ${claseTachado}">
                            <span>${deuda.concepto}</span>
                            <span>$${deuda.monto.toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
                        </div>
                        <div class="deuda-fecha">📅 ${deuda.fecha}</div>
                        <div>
                            ${botonesHTML}
                        </div>
                    </div>
                `;
            });

            // Actualizar texto del total
            const textoTotal = viendoHistorial ? "Total Pagado Histórico:" : "Total Adeudado:";
            document.getElementById('lblTotal').innerText = `${textoTotal} $${total.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        }

        window.guardarDeuda = async function() {
            const concepto = document.getElementById('txtConcepto').value.trim();
            const monto = parseFloat(document.getElementById('txtMonto').value);
            const idEdicion = document.getElementById('txtIdEdicion').value;

            if (!concepto || isNaN(monto)) {
                alert("Por favor, llena ambos campos correctamente.");
                return;
            }

            const fechaActual = new Date().toLocaleString('es-CO');

            try {
                if (idEdicion !== "") {
                    const deudaRef = doc(db, "deudas", idEdicion);
                    await updateDoc(deudaRef, { concepto: concepto, monto: monto });
                    document.getElementById('txtIdEdicion').value = "";
                    document.getElementById('btnAgregar').innerText = "➕ Agregar Deuda";
                    document.getElementById('btnAgregar').style.backgroundColor = "var(--primary)";
                } else {
                    await addDoc(collection(db, "deudas"), {
                        concepto: concepto,
                        monto: monto,
                        fecha: fechaActual,
                        estado: 'activa' // <-- Se guarda por defecto como activa
                    });
                }
                document.getElementById('txtConcepto').value = '';
                document.getElementById('txtMonto').value = '';
                
                // Si estaba viendo el historial y agrega una nueva, lo devolvemos a las activas
                if (viendoHistorial) {
                    window.alternarVista();
                }
                
            } catch (error) {
                alert("Error al guardar: " + error.message);
            }
        };

        // EN LUGAR DE BORRAR, AHORA SOLO CAMBIAMOS EL ESTADO A "PAGADA"
        window.marcarPagada = async function(id) {
            await updateDoc(doc(db, "deudas", id), { estado: 'pagada' });
        };

        // RECUPERAR DEL HISTORIAL
        window.recuperarDeuda = async function(id) {
            await updateDoc(doc(db, "deudas", id), { estado: 'activa' });
        };

        // ESTE SÍ BORRA DE VERDAD LA DEUDA DE LA BASE DE DATOS
        window.eliminarDefinitivo = async function(id) {
            if(confirm("¿Seguro que deseas ELIMINAR esta deuda de la base de datos? Esta acción no se puede deshacer.")) {
                await deleteDoc(doc(db, "deudas", id));
            }
        };

        window.prepararEdicion = function(id, concepto, monto) {
            document.getElementById('txtConcepto').value = concepto;
            document.getElementById('txtMonto').value = monto;
            document.getElementById('txtIdEdicion').value = id;
            
            const btn = document.getElementById('btnAgregar');
            btn.innerText = "💾 Guardar Cambios";
            btn.style.backgroundColor = "var(--warning)";
            window.scrollTo(0, 0);
        };

        window.exportarExcel = function() {
            // Filtrar lo que se va a exportar según la vista actual
            const deudasAExportar = deudasLocales.filter(d => {
                const estado = d.estado || 'activa';
                return viendoHistorial ? estado === 'pagada' : estado === 'activa';
            });

            if (deudasAExportar.length === 0) {
                alert("No hay datos en esta vista para exportar.");
                return;
            }

            const datosFormateados = deudasAExportar.map(d => ({
                "Concepto de Deuda": d.concepto,
                "Monto ($)": d.monto,
                "Estado": d.estado || 'activa',
                "Fecha de Registro": d.fecha
            }));

            const worksheet = XLSX.utils.json_to_sheet(datosFormateados);
            const workbook = XLSX.utils.book_new();
            const nombreHoja = viendoHistorial ? "Historial Pagadas" : "Deudas Activas";
            
            XLSX.utils.book_append_sheet(workbook, worksheet, nombreHoja);
            XLSX.writeFile(workbook, `Reporte_${nombreHoja.replace(" ", "_")}.xlsx`);
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
